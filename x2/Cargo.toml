[package]
name = "x2"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A conservative authenticated file-encryption CLI"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aes = { version = "0.9.2", default-features = false, features = ["zeroize"] }
aes-gcm-siv = { version = "0.12.0", default-features = false, features = ["aes", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
# These direct feature activations zeroize the AEADs' authenticator state.
poly1305 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
polyval = { version = "0.7.3", default-features = false, features = ["zeroize"] }
rpassword = "7.5.4"
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
zeroize = { version = "1.9.0", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK lets regular-file validation reject a FIFO without waiting for a writer.
libc = "0.2.189"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
