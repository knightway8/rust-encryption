[package]
name = "ezcrypt"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Crash-safe, authenticated file encryption for Windows 11"
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.4.0"
zeroize = { version = "1.8.1", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
