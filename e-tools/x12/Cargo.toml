[package]
name = "x12"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
cipher = "=0.5.2"
kcipher2 = { version = "=0.1.3", features = ["zeroize"] }
hmac = "=0.13.0"
sha2-mac = { package = "sha2", version = "=0.11.0" }
getrandom = "=0.4.3"
pbkdf2 = "=0.12.2"
sha2 = "=0.10.9"
rpassword = "=7.5.4"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
