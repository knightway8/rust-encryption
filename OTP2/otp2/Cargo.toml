[package]
name = "otp2"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Linux-only atomic XOR file transformation"

[dependencies]
getrandom = "0.3.4"
zeroize = "1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"
