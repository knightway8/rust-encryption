[package]
name = "filecrypt"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Authenticated streaming file encryption with strict no-overwrite semantics"
license = "MIT"

[dependencies]
aead = { version = "0.6.1", default-features = false, features = ["alloc"] }
aead-stream = { version = "0.6.0", features = ["alloc"] }
aes = { version = "0.9.2", features = ["zeroize"] }
aes-gcm-siv = { version = "0.12.0", default-features = false, features = ["aes", "zeroize"] }
atomicwrites = "0.4.4"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
secrecy = "0.10.3"
same-file = "1.0.6"
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
zeroize = "1.9.0"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
