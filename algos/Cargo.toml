[package]
name = "algos"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Thirty auditable, authenticated file-encryption CLI suites"
license = "MIT OR Apache-2.0"
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]
aead = "=0.6.1"
aes = { version = "=0.9.2", features = ["zeroize"] }
aes-gcm = { version = "=0.11.0", features = ["zeroize"] }
aes-gcm-siv = { version = "=0.12.0", features = ["zeroize"] }
aes-siv = { version = "=0.8.0", features = ["zeroize"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
aria = { version = "=0.2.0", features = ["zeroize"] }
belt-ctr = { version = "=0.2.1", features = ["zeroize"] }
camellia = { version = "=0.2.1", features = ["zeroize"] }
cast6 = { version = "=0.2.0", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
cipher = { version = "=0.5.2", features = ["zeroize"] }
clap = { version = "=4.5.45", features = ["derive"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
getrandom = "=0.3.3"
hc-256 = { version = "=0.6.0", features = ["zeroize"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
kuznyechik = { version = "=0.9.0", features = ["zeroize"] }
rpassword = "=7.4.0"
salsa20 = { version = "=0.11.0", features = ["zeroize"] }
same-file = "=1.0.6"
serpent = { version = "=0.6.0", features = ["zeroize"] }
sha2 = { version = "=0.11.0", features = ["zeroize"] }
sm4 = { version = "=0.6.0", features = ["zeroize"] }
tempfile = "=3.20.0"
thiserror = "=2.0.12"
twofish = { version = "=0.8.0", features = ["zeroize"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
assert_cmd = "=2.0.17"
hex-literal = "=1.0.0"
predicates = "=3.1.3"
proptest = "=1.7.0"

[[bin]]
name = "aes128-gcm-file"
path = "src/bin/aes128-gcm-file.rs"
[[bin]]
name = "aes256-gcm-file"
path = "src/bin/aes256-gcm-file.rs"
[[bin]]
name = "aes128-gcm-siv-file"
path = "src/bin/aes128-gcm-siv-file.rs"
[[bin]]
name = "aes256-gcm-siv-file"
path = "src/bin/aes256-gcm-siv-file.rs"
[[bin]]
name = "aes128-cmac-siv-file"
path = "src/bin/aes128-cmac-siv-file.rs"
[[bin]]
name = "aes256-cmac-siv-file"
path = "src/bin/aes256-cmac-siv-file.rs"
[[bin]]
name = "chacha20-poly1305-file"
path = "src/bin/chacha20-poly1305-file.rs"
[[bin]]
name = "xchacha20-poly1305-file"
path = "src/bin/xchacha20-poly1305-file.rs"
[[bin]]
name = "aes128-ctr-hmac-file"
path = "src/bin/aes128-ctr-hmac-file.rs"
[[bin]]
name = "aes192-ctr-hmac-file"
path = "src/bin/aes192-ctr-hmac-file.rs"
[[bin]]
name = "aes256-ctr-hmac-file"
path = "src/bin/aes256-ctr-hmac-file.rs"
[[bin]]
name = "camellia128-ctr-hmac-file"
path = "src/bin/camellia128-ctr-hmac-file.rs"
[[bin]]
name = "camellia192-ctr-hmac-file"
path = "src/bin/camellia192-ctr-hmac-file.rs"
[[bin]]
name = "camellia256-ctr-hmac-file"
path = "src/bin/camellia256-ctr-hmac-file.rs"
[[bin]]
name = "aria128-ctr-hmac-file"
path = "src/bin/aria128-ctr-hmac-file.rs"
[[bin]]
name = "aria192-ctr-hmac-file"
path = "src/bin/aria192-ctr-hmac-file.rs"
[[bin]]
name = "aria256-ctr-hmac-file"
path = "src/bin/aria256-ctr-hmac-file.rs"
[[bin]]
name = "twofish128-ctr-hmac-file"
path = "src/bin/twofish128-ctr-hmac-file.rs"
[[bin]]
name = "twofish192-ctr-hmac-file"
path = "src/bin/twofish192-ctr-hmac-file.rs"
[[bin]]
name = "twofish256-ctr-hmac-file"
path = "src/bin/twofish256-ctr-hmac-file.rs"
[[bin]]
name = "serpent128-ctr-hmac-file"
path = "src/bin/serpent128-ctr-hmac-file.rs"
[[bin]]
name = "serpent192-ctr-hmac-file"
path = "src/bin/serpent192-ctr-hmac-file.rs"
[[bin]]
name = "serpent256-ctr-hmac-file"
path = "src/bin/serpent256-ctr-hmac-file.rs"
[[bin]]
name = "sm4-ctr-hmac-file"
path = "src/bin/sm4-ctr-hmac-file.rs"
[[bin]]
name = "kuznyechik-ctr-hmac-file"
path = "src/bin/kuznyechik-ctr-hmac-file.rs"
[[bin]]
name = "cast6-ctr-hmac-file"
path = "src/bin/cast6-ctr-hmac-file.rs"
[[bin]]
name = "belt-ctr-hmac-file"
path = "src/bin/belt-ctr-hmac-file.rs"
[[bin]]
name = "salsa20-hmac-file"
path = "src/bin/salsa20-hmac-file.rs"
[[bin]]
name = "xsalsa20-hmac-file"
path = "src/bin/xsalsa20-hmac-file.rs"
[[bin]]
name = "hc256-hmac-file"
path = "src/bin/hc256-hmac-file.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
