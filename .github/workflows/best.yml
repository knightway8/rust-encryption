name: best checks
on:
  push:
    paths: ['best/**', '.github/workflows/best.yml']
  pull_request:
    paths: ['best/**', '.github/workflows/best.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: best
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked -- --test-threads=4
      - run: cargo test --release --all-targets --locked -- --test-threads=4
      - run: cargo test --doc --locked
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
